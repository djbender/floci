name: Fork Release

# Fork-only. When fork/release takes in a new upstream release, tags it X.Y.Z+fork.1,
# builds the images and publishes them. Run manually with bump to cut +fork.N+1
# for a fork-only fix on the same upstream release.

on:
  push:
    branches: [fork/release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Cut the next +fork.N for the current upstream release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'djbender/floci'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.v.outputs.release }}
      base: ${{ steps.v.outputs.base }}
      tag: ${{ steps.v.outputs.tag }}
      n: ${{ steps.v.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute fork version
        id: v
        run: |
          base=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*[-+]*')
          last=$(git tag -l "$base+fork.*" | sed 's/.*+fork\.//' | sort -n | tail -1)
          if [ -z "$last" ]; then
            n=1
          elif [ "${{ inputs.bump }}" = "true" ]; then
            n=$((last + 1))
          else
            echo "No new upstream release absorbed and no bump requested"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$base+fork.$n"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Floci $base with fork patches ($tag)"
          git push origin "$tag"
          {
            echo "release=true"
            echo "base=$base"
            echo "tag=$tag"
            echo "n=$n"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      source-ref: ${{ needs.version.outputs.tag }}
      image: ghcr.io/${{ github.repository_owner }}/floci
      publish-native: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ needs.version.outputs.base }}
      TAG: ${{ needs.version.outputs.tag }}
      N: ${{ needs.version.outputs.n }}
      JVM: ${{ needs.build.outputs.jvm-digest-ref }}
      NATIVE: ${{ needs.build.outputs.native-digest-ref }}
      COMPAT: ${{ needs.build.outputs.compat-digest-ref }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add version tags
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/floci"
          add() {
            src="$1"; suffix="$2"
            [ -n "$src" ] || return 0
            docker buildx imagetools create \
              -t "$repo:$BASE-fork.$N$suffix" \
              -t "$repo:$BASE-fork$suffix" \
              -t "$repo:latest$suffix" \
              "$src"
          }
          add "$JVM" ""
          add "$NATIVE" "-native"
          add "$COMPAT" "-native-compat"
      - name: Create GitHub release
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/floci"
          gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag \
            --title "$TAG" \
            --notes "Upstream [$BASE](https://github.com/floci-io/floci/releases/tag/$BASE) plus fork patches.

          Images:
          - \`$repo:$BASE-fork.$N\`
          - \`$repo:$BASE-fork.$N-native\`
          - \`$repo:$BASE-fork.$N-native-compat\`"
