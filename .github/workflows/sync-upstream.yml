name: Sync Upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'djbender/floci'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fast-forward main from upstream
        id: ff
        run: |
          if out=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch=main 2>&1); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "$out"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "$out" > ff-error.txt
            cat ff-error.txt
          fi

      - name: Report a blocked fast-forward
        if: steps.ff.outputs.ok == 'false'
        run: |
          body=$(printf 'The automatic fast-forward of `main` failed, usually because upstream changed `.github/workflows/*`, which `GITHUB_TOKEN` cannot push.\n\nRun locally:\n\n```\ngh repo sync %s -b main\n```\n\nError:\n\n```\n%s\n```\n' "$REPO" "$(cat ff-error.txt)")
          gh label create --repo "$REPO" upstream-sync --color 0e8a16 --force >/dev/null
          existing=$(gh issue list --repo "$REPO" --label upstream-sync --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$REPO" "$existing" --body "$body"
          else
            gh issue create --repo "$REPO" --label upstream-sync --title "Upstream sync needs manual fast-forward" --body "$body"
          fi

      - name: Open sync PR into fork/main
        run: |
          ahead=$(gh api "repos/$REPO/compare/fork/main...main" -q .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "fork/main already contains main"
            exit 0
          fi
          open=$(gh pr list --repo "$REPO" --base fork/main --head main --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            echo "PR #$open already open"
            exit 0
          fi
          sha=$(gh api "repos/$REPO/commits/main" -q '.sha[0:9]')
          gh pr create --repo "$REPO" --base fork/main --head main \
            --title "chore: sync upstream ($sha)" \
            --body "Upstream commits on \`main\` not yet in \`fork/main\` ($ahead).

          Merge with **Create a merge commit**. Never squash or rebase. PRs opened by \`GITHUB_TOKEN\` do not run CI automatically: close and reopen to trigger it."
